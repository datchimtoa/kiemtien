services:
  - type: web
    name: kiemtienvip
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: DB_DRIVER
        value: pgsql
      - key: SMS_DRIVER
        value: telegram
      - key: APP_ENV
        value: production
      # Domain chính — PHẢI là www (apex htxg.pro bị 307 redirect → webhook/postback mất).
      - key: BASE_URL
        value: https://www.htxg.pro
      # DB Neon — điền 1 trong 2 cách (ưu tiên DATABASE_URL copy từ dashboard Neon):
      - key: DATABASE_URL
        sync: false
      # Secrets — Render sẽ hỏi giá trị khi tạo Blueprint (không lưu trong repo)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: PUBCRYPTO_SITE_KEY
        sync: false
      - key: PUBCRYPTO_API_KEY
        sync: false
      # Forward secret: BẮT BUỘC — dùng verify chữ ký postback md5(subId+transId+reward_pb+secret).
      # Không có = mọi postback bị từ chối (signature_invalid), tiền KHÔNG vào ví.
      - key: PUBCRYPTO_FORWARD_SECRET
        sync: false
      - key: POSTBACK_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SETUP_KEY
        sync: false

